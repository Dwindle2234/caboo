name: cabo                 # fixed compose project name, keeps it separate from everything else

services:
  cabo:
    build:
      context: .
      dockerfile: Dockerfile
    image: cabo:local
    pull_policy: build        # always build locally, never try Docker Hub
    # Unraid remembers icons by container name; renamed from 'cabo' so Unraid looks the icon up fresh
    container_name: cabo-game
    restart: unless-stopped
    environment:
      # Secrets come from the untracked .env file next to this one (see .env.example). Never put them here.
      - SECRET_KEY=${CABO_SECRET_KEY:-}
      # Number of reverse proxies in front of the app whose X-Forwarded-* headers to trust
      - PROXY_HOPS=1
      - TZ=Europe/London
    labels:
      # Unraid Docker dashboard: icon + "WebUI" menu link. If the icon doesn't show, set CABO_ICON_URL in .env
      # to the full address Unraid can reach, e.g. http://192.168.1.10:8088/static/icon.png
      - net.unraid.docker.icon=${CABO_ICON_URL:-http://localhost:8088/static/icon.png}
      - net.unraid.docker.webui=http://[IP]:[PORT:8088]/
    ports:
      # host:container - point your reverse proxy at http://<server-ip>:8088
      - "8088:8000"
    # Resource caps so Cabo can never hog the server
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
